[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-review-wiki-skill"
version = "0.1.0"
description = "Codex skill helpers for Zotero-backed literature reviews and Obsidian wiki maintenance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Literature Review Wiki Skill maintainers" }
]
dependencies = []
keywords = ["codex", "literature-review", "obsidian", "zotero"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
litwiki-init = "literature_review_wiki.cli.init_project:main"
litwiki-daily-json = "literature_review_wiki.cli.daily_json:main"
litwiki-lint = "literature_review_wiki.cli.lint_wiki:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
